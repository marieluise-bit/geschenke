en wir uns bei Ihnen und Ihrem Team bedanken."},{ton:["klassisch","dankbar"],t:"Ein ereignisreiches Jahr liegt hinter uns, und wir m\xF6chten es nicht beschlie\xDFen, ohne Danke zu sagen."},{ton:["knapp"],t:"Ein kleiner Gru\xDF zum Jahresende."},{ton:["knapp","herzlich"],t:"Weihnachten steht vor der T\xFCr, Zeit f\xFCr ein Dankesch\xF6n."},{ton:["humorvoll"],t:"Die Rezepte waren viele, die Nerven manchmal d\xFCnn, der Kaffee immer stark: Das Jahr war gut."},{ton:["humorvoll"],t:"Wenn der Lebkuchen im Regal steht, wissen wir: Zeit, Danke zu sagen."},{ton:["persoenlich"],t:"Wieder ein Jahr, in dem wir uns aufeinander verlassen konnten."},{ton:["persoenlich","dankbar"],t:"Es gab Tage in diesem Jahr, da hat die kurze Abstimmung mit Ihrer Praxis den Unterschied gemacht."},{ton:["dankbar"],t:"Hinter jedem Rezept, das bei uns ankommt, steckt Ihre Arbeit. Das sehen wir."}]},{id:"dank",label:"Dank",saetze:[{ton:["herzlich","dankbar"],t:"Danke f\xFCr die gute und verl\xE4ssliche Zusammenarbeit in diesem Jahr."},{ton:["herzlich"],t:"Danke, dass Sie da waren, wenn es mal schnell gehen musste, und f\xFCr die vielen freundlichen Anrufe dazwischen."},{ton:["klassisch"],t:"Wir danken Ihnen f\xFCr das Vertrauen und die angenehme Zusammenarbeit."},{ton:["klassisch","dankbar"],t:"F\xFCr die partnerschaftliche und unkomplizierte Zusammenarbeit sagen wir herzlich Danke."},{ton:["knapp"],t:"Danke f\xFCr die gute Zusammenarbeit."},{ton:["knapp","dankbar"],t:"Danke f\xFCr ein gutes gemeinsames Jahr."},{ton:["humorvoll"],t:"Danke f\xFCr jedes lesbare Rezept, jede schnelle R\xFCckfrage und die Geduld, wenn wir mal wieder nachgefragt haben."},{ton:["humorvoll","herzlich"],t:"Danke, dass die Zusammenarbeit mit Ihnen so reibungslos ist, dass wir sie fast f\xFCr selbstverst\xE4ndlich halten. Tun wir aber nicht."},{ton:["persoenlich"],t:"Danke f\xFCr die kurzen Wege, die ehrlichen R\xFCckmeldungen und das Mitdenken f\xFCr unsere gemeinsamen Patientinnen und Patienten."},{ton:["persoenlich","dankb
